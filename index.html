
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Community</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:Arial,sans-serif;color:#222}
header{background:#1877f2;color:white;padding:16px;font-size:25px;font-weight:bold}
main{max-width:600px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:15px;margin-bottom:13px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:7px 0;font:inherit}
button{background:#1877f2;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold}
#preview img{width:100%;border-radius:10px;margin-top:10px}
.post{background:white;border-radius:12px;padding:15px;margin-bottom:12px}
.post img{width:100%;border-radius:10px;margin-top:10px}
nav{position:sticky;bottom:0;background:white;padding:14px;display:flex;justify-content:space-around;border-top:1px solid #ddd}
nav a{color:#1877f2;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>facebook</header>
<main>
  <div class="card">
    <h3>Create a post</h3>
    <textarea id="caption" placeholder="What's on your mind?"></textarea>
    <input type="file" id="photos" accept="image/*" multiple>
    <div id="preview"></div>
    <button onclick="publish()">Post</button>
  </div>
  <h3>Community Feed</h3>
  <div id="feed">
    <div class="post">
      <b>Welcome to FB Community!</b>
      <p>Connect, share and belong. Start by creating your first post.</p>
    </div>
  </div>
</main>
<nav>
  <a href="#">Home</a>
  <a href="#photos">Photos</a>
  <a href="#feed">Feed</a>
</nav>
<script>
const tg=window.Telegram.WebApp;
tg.ready();
tg.expand();

let selected=[];

document.getElementById('photos').addEventListener('change',function(){
  selected=Array.from(this.files).filter(f=>f.type.startsWith('image/'));
  const preview=document.getElementById('preview');
  preview.innerHTML='';
  selected.forEach(file=>{
    const img=document.createElement('img');
    img.src=URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

function publish(){
  const caption=document.getElementById('caption').value.trim();
  if(!caption&&!selected.length){
    alert('Write something or choose a photo first.');
    return;
  }
  const post=document.createElement('div');
  post.className='post';
  const text=document.createElement('p');
  text.textContent=caption;
  post.appendChild(text);
  selected.forEach(file=>{
    const img=document.createElement('img');
    img.src=URL.createObjectURL(file);
    post.appendChild(img);
  });
  document.getElementById('feed').prepend(post);
  document.getElementById('caption').value='';
  document.getElementById('photos').value='';
  document.getElementById('preview').innerHTML='';
  selected=[];
}
</script>
</body>
</html>
